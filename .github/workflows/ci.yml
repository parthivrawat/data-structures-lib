name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, go, rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Python ----------
      - name: Set up Python 3.13
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: python/pyproject.toml

      - name: Install Python package (dev extras)
        if: matrix.language == 'python'
        run: pip install -e "./python[dev]"

      - name: Run Python tests
        if: matrix.language == 'python'
        run: pytest python/test_data_structures_lib.py -v

      # ---------- TypeScript / Node.js ----------
      - name: Set up Node.js 20
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install, test, and build TypeScript package
        if: matrix.language == 'typescript'
        run: |
          cd typescript
          npm install
          npm test
          npm run build

      # ---------- Go ----------
      - name: Set up Go 1.21
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.mod

      - name: Run Go tests and vet
        if: matrix.language == 'go'
        run: |
          cd go
          go test -count=1 ./...
          go vet ./...

      # ---------- Rust ----------
      - name: Set up Rust stable
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        if: matrix.language == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests and clippy
        if: matrix.language == 'rust'
        run: |
          cd rust
          cargo test
          cargo clippy
