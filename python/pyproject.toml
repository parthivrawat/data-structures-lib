[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-structures-lib"
version = "1.1.0"
description = "A comprehensive, zero-dependency collection of fundamental data structures for Python"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Parthiv Rawat"},
]
requires-python = ">=3.7"
dependencies = []
keywords = ["data-structures", "collections", "algorithms", "stack", "queue", "linked-list", "tree", "graph", "heap", "trie"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/parthivrawat/data-structures-lib"
Repository = "https://github.com/parthivrawat/data-structures-lib"

[tool.setuptools.packages.find]
include = ["data_structures_lib*"]

[tool.setuptools.package-data]
data_structures_lib = ["py.typed"]
